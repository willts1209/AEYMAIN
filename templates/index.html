<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AEY — Voice to Survey Table</title>
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#0f0f10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AEY">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<style>
  :root {
    --bg: #0f0f10;
    --fg: #e8e6e3;
    --muted: #8a8580;
    --accent: #c89c5a;
    --accent-fg: #0f0f10;
    --card: #1c1c1f;
    --border: #2a2a2e;
    --danger: #c8625a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro", system-ui, sans-serif;
    background: var(--bg);
    color: var(--fg);
    padding: 16px;
    padding-top: max(16px, env(safe-area-inset-top));
    padding-bottom: max(40px, env(safe-area-inset-bottom));
    font-size: 16px;
    line-height: 1.4;
  }
  h1 { font-size: 22px; margin: 4px 0 16px 0; font-weight: 700; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em; }
  input[type=text], input[type=date], input[type=file] {
    width: 100%; padding: 12px; font-size: 16px;
    background: #25252a; color: var(--fg);
    border: 1px solid var(--border); border-radius: 8px;
    font-family: inherit;
  }
  input:focus { outline: none; border-color: var(--accent); }
  button {
    width: 100%; padding: 15px; font-size: 16px; font-weight: 600;
    background: var(--accent); color: var(--accent-fg);
    border: none; border-radius: 12px; cursor: pointer;
    margin-top: 10px; font-family: inherit;
  }
  button:disabled { opacity: 0.4; }
  button.secondary { background: transparent; color: var(--fg); border: 1px solid var(--border); }
  .status { color: var(--muted); font-size: 14px; margin: 12px 0 4px 0; min-height: 20px; }
  .status.error { color: var(--danger); }
  .progress {
    margin-top: 10px;
    height: 4px;
    background: #25252a;
    border-radius: 2px;
    overflow: hidden;
    position: relative;
  }
  .progress-bar {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.4s ease-out;
    transform-origin: left center;
  }
  .progress-bar.indeterminate {
    width: 35%;
    animation: indeterminate 1.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
  }
  @keyframes indeterminate {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(360%); }
  }
  .progress-meta {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--muted);
    margin-top: 6px;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
  }
  .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .field { margin-bottom: 12px; }
  .field:last-child { margin-bottom: 0; }
  /* Editable observation cards — one per row */
  #rows { display: flex; flex-direction: column; gap: 10px; }
  .row-card {
    background: #18181b;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 14px 12px 14px;
    position: relative;
  }
  .row-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px 10px;
  }
  .field-pair { display: flex; flex-direction: column; min-width: 0; }
  .field-pair label {
    font-size: 10px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.05em;
    margin-bottom: 3px; font-weight: 600;
  }
  .field-pair input {
    width: 100%; padding: 9px 10px; font-size: 14px;
    background: #25252a; color: var(--fg);
    border: 1px solid var(--border); border-radius: 6px;
    font-family: inherit;
  }
  .field-pair input:focus { outline: none; border-color: var(--accent); }
  .span-2 { grid-column: span 2; }
  .span-3 { grid-column: span 3; }
  .row-delete {
    position: absolute; top: 6px; right: 6px;
    width: 32px; height: 32px;
    background: transparent; border: none; color: var(--danger);
    font-size: 22px; line-height: 1; cursor: pointer;
    padding: 0; margin: 0;
  }
  .transcript-box {
    background: #18181b; padding: 12px; border-radius: 8px;
    font-size: 13px; color: var(--muted); white-space: pre-wrap;
    max-height: 160px; overflow-y: auto; margin-top: 12px;
    border: 1px solid var(--border);
  }
  .hidden { display: none !important; }
  details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  /* On wider screens, give each row card more breathing room */
  @media (min-width: 720px) {
    .row-grid { grid-template-columns: repeat(6, 1fr); }
    .span-2 { grid-column: span 2; }
    .span-3 { grid-column: span 3; }
  }
</style>
</head>
<body>

<h1>AEY · Voice → Table</h1>

<div class="card">
  <div class="field-grid">
    <div>
      <label>Site</label>
      <input type="text" id="site" placeholder="Smock Mill" autocapitalize="words">
    </div>
    <div>
      <label>Date</label>
      <input type="date" id="date">
    </div>
  </div>
  <div class="field-grid">
    <div>
      <label>Surveyor</label>
      <input type="text" id="surveyor" placeholder="Name" autocapitalize="words">
    </div>
    <div>
      <label>Type</label>
      <input type="text" id="survey_type" value="Dusk emergence">
    </div>
  </div>
</div>

<div class="card">
  <label>Audio recording</label>
  <input type="file" id="audio" accept="audio/*,.m4a,.mp3,.wav,.aac">
  <button id="processBtn">Process recording</button>
  <div class="status" id="status"></div>
  <div class="progress hidden" id="progress">
    <div class="progress-bar" id="progressBar"></div>
  </div>
  <div class="progress-meta hidden" id="progressMeta">
    <span id="progressPhase">Working</span>
    <span id="progressTime">0:00</span>
  </div>
  <details id="transcriptDetails" style="margin-top: 8px;" class="hidden">
    <summary>Show raw transcript</summary>
    <div class="transcript-box" id="transcriptBox"></div>
  </details>
</div>

<div class="card hidden" id="tableCard">
  <label>Observations · tap any field to edit</label>
  <div id="rows"></div>
  <button class="secondary" id="addRowBtn">+ Add observation</button>
  <button class="secondary" id="copyBtn">Copy table</button>
  <button id="downloadBtn">Download .docx</button>
</div>

<datalist id="species-list">
  <option value="Common pipistrelle"></option>
  <option value="Soprano pipistrelle"></option>
  <option value="Nathusius pipistrelle"></option>
  <option value="Noctule"></option>
  <option value="Leisler's bat"></option>
  <option value="Serotine"></option>
  <option value="Brown long-eared"></option>
  <option value="Grey long-eared"></option>
  <option value="Daubenton's bat"></option>
  <option value="Natterer's bat"></option>
  <option value="Whiskered bat"></option>
  <option value="Brandt's bat"></option>
  <option value="Bechstein's bat"></option>
  <option value="Barbastelle"></option>
  <option value="Greater horseshoe"></option>
  <option value="Lesser horseshoe"></option>
  <option value="Alcathoe"></option>
  <option value="Myotis sp."></option>
  <option value="Pipistrelle sp."></option>
  <option value="Unidentified bat"></option>
</datalist>

<datalist id="behaviour-list">
  <option value="Foraging"></option>
  <option value="Commuting"></option>
  <option value="Flying"></option>
  <option value="Emerged"></option>
  <option value="Re-entry"></option>
  <option value="Social"></option>
  <option value="Other"></option>
</datalist>

<datalist id="direction-list">
  <option value="N"></option>
  <option value="NE"></option>
  <option value="E"></option>
  <option value="SE"></option>
  <option value="S"></option>
  <option value="SW"></option>
  <option value="W"></option>
  <option value="NW"></option>
</datalist>

<script>
document.getElementById('date').valueAsDate = new Date();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/static/sw.js').catch(console.error);
}

const $ = (id) => document.getElementById(id);
const setStatus = (msg, isError = false) => {
  const el = $('status');
  el.textContent = msg;
  el.classList.toggle('error', isError);
};

let progressStart = null;
let progressTimer = null;

function progressStartUI(phase) {
  $('progress').classList.remove('hidden');
  $('progressMeta').classList.remove('hidden');
  $('progressBar').classList.add('indeterminate');
  $('progressBar').style.width = '35%';
  $('progressPhase').textContent = phase;
  progressStart = Date.now();
  $('progressTime').textContent = '0:00';
  if (progressTimer) clearInterval(progressTimer);
  progressTimer = setInterval(() => {
    const s = Math.floor((Date.now() - progressStart) / 1000);
    $('progressTime').textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  }, 250);
}

function progressPhase(phase) {
  $('progressPhase').textContent = phase;
}

function progressEndUI(success = true) {
  if (progressTimer) { clearInterval(progressTimer); progressTimer = null; }
  $('progressBar').classList.remove('indeterminate');
  $('progressBar').style.width = success ? '100%' : '0%';
  if (success) {
    setTimeout(() => {
      $('progress').classList.add('hidden');
      $('progressMeta').classList.add('hidden');
      $('progressBar').style.width = '0%';
    }, 700);
  } else {
    $('progress').classList.add('hidden');
    $('progressMeta').classList.add('hidden');
  }
}

const FIELDS = [
  { name: 'time',      label: 'Time',      span: 1, placeholder: '21:35', inputmode: 'numeric' },
  { name: 'species',   label: 'Species',   span: 2, datalist: 'species-list', autocapitalize: 'sentences' },
  { name: 'count',     label: 'Count',     span: 1, default: '1', inputmode: 'numeric' },
  { name: 'behaviour', label: 'Behaviour', span: 1, datalist: 'behaviour-list' },
  { name: 'direction', label: 'Dir',       span: 1, placeholder: 'SE', datalist: 'direction-list' },
  { name: 'location',  label: 'Location',  span: 3, autocapitalize: 'sentences' },
  { name: 'notes',     label: 'Notes',     span: 3, autocapitalize: 'sentences' },
];

function addRow(r = {}) {
  const container = $('rows');
  const card = document.createElement('div');
  card.className = 'row-card';

  const del = document.createElement('button');
  del.className = 'row-delete';
  del.type = 'button';
  del.textContent = '×';
  del.setAttribute('aria-label', 'Delete row');
  del.addEventListener('click', () => card.remove());
  card.appendChild(del);

  const grid = document.createElement('div');
  grid.className = 'row-grid';
  FIELDS.forEach(f => {
    const fp = document.createElement('div');
    fp.className = `field-pair span-${f.span}`;

    const lbl = document.createElement('label');
    lbl.textContent = f.label;
    fp.appendChild(lbl);

    const inp = document.createElement('input');
    inp.type = 'text';
    inp.dataset.field = f.name;
    inp.value = r[f.name] || f.default || '';
    if (f.placeholder) inp.placeholder = f.placeholder;
    if (f.inputmode) inp.inputMode = f.inputmode;
    if (f.datalist) inp.setAttribute('list', f.datalist);
    if (f.autocapitalize) inp.setAttribute('autocapitalize', f.autocapitalize);
    inp.setAttribute('autocomplete', 'off');
    inp.setAttribute('spellcheck', 'false');
    fp.appendChild(inp);

    grid.appendChild(fp);
  });
  card.appendChild(grid);
  container.appendChild(card);
}

function renderRows(rows) {
  $('rows').innerHTML = '';
  rows.forEach(r => addRow(r));
}

$('addRowBtn').addEventListener('click', () => addRow());

$('processBtn').addEventListener('click', async () => {
  const file = $('audio').files[0];
  if (!file) {
    setStatus('Choose an audio file first.', true);
    return;
  }

  const btn = $('processBtn');
  btn.disabled = true;
  progressStartUI('Compressing & transcribing');

  try {
    setStatus('Compressing audio and stripping silence...');
    const fd = new FormData();
    fd.append('audio', file);
    const trRes = await fetch('/api/transcribe', { method: 'POST', body: fd });
    if (!trRes.ok) {
      const err = await trRes.json().catch(() => ({}));
      throw new Error(err.error || `transcribe failed (${trRes.status})`);
    }
    const tr = await trRes.json();

    $('transcriptBox').textContent = tr.transcript;
    $('transcriptDetails').classList.remove('hidden');

    const origMin = tr.original_seconds ? Math.round(tr.original_seconds / 60) : null;
    const speechMin = tr.compressed_seconds ? Math.round(tr.compressed_seconds / 60) : null;
    if (origMin !== null && speechMin !== null && origMin > speechMin) {
      const removedMin = origMin - speechMin;
      setStatus(`Stripped ${removedMin} min of silence (${origMin} min → ${speechMin} min of speech). Parsing rows...`);
    } else {
      setStatus('Parsing transcript into rows...');
    }
    progressPhase('Parsing rows');
    const prRes = await fetch('/api/parse', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ transcript: tr.transcript }),
    });
    if (!prRes.ok) throw new Error(`parse failed (${prRes.status})`);
    const pr = await prRes.json();

    renderRows(pr.rows || []);
    $('tableCard').classList.remove('hidden');
    setStatus(`Done — ${(pr.rows || []).length} rows extracted. Review and edit before download.`);
    progressEndUI(true);
  } catch (e) {
    setStatus('Error: ' + e.message, true);
    console.error(e);
    progressEndUI(false);
  } finally {
    btn.disabled = false;
  }
});

function readRows() {
  const rows = [];
  document.querySelectorAll('#rows .row-card').forEach(card => {
    const row = {};
    card.querySelectorAll('input[data-field]').forEach(inp => { row[inp.dataset.field] = inp.value; });
    rows.push(row);
  });
  return rows;
}

function escapeHTML(s) {
  return String(s ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

const COPY_HEADERS = ['Time', 'Species', 'Count', 'Behaviour', 'Location', 'Direction', 'Notes'];
const COPY_KEYS = ['time', 'species', 'count', 'behaviour', 'location', 'direction', 'notes'];

function buildTableHTML(rows) {
  const head = '<tr>' + COPY_HEADERS.map(h => `<th>${h}</th>`).join('') + '</tr>';
  const body = rows.map(r => {
    const cells = COPY_KEYS.map(k => escapeHTML(k === 'count' && !r[k] ? '1' : r[k]));
    return '<tr>' + cells.map(c => `<td>${c}</td>`).join('') + '</tr>';
  }).join('');
  return `<table border="1" cellspacing="0" cellpadding="4" style="border-collapse:collapse;font-family:Calibri,Arial,sans-serif;font-size:10pt;"><thead>${head}</thead><tbody>${body}</tbody></table>`;
}

function buildTablePlain(rows) {
  const lines = [COPY_HEADERS.join('\t')];
  rows.forEach(r => {
    lines.push(COPY_KEYS.map(k => (k === 'count' && !r[k] ? '1' : (r[k] ?? ''))).join('\t'));
  });
  return lines.join('\n');
}

$('copyBtn').addEventListener('click', async () => {
  const rows = readRows();
  if (!rows.length) {
    setStatus('No rows to copy yet.', true);
    return;
  }
  const html = buildTableHTML(rows);
  const plain = buildTablePlain(rows);
  try {
    if (navigator.clipboard && window.ClipboardItem) {
      await navigator.clipboard.write([new ClipboardItem({
        'text/html': new Blob([html], { type: 'text/html' }),
        'text/plain': new Blob([plain], { type: 'text/plain' }),
      })]);
    } else if (navigator.clipboard) {
      await navigator.clipboard.writeText(plain);
    } else {
      throw new Error('clipboard not available');
    }
    setStatus(`Copied ${rows.length} ${rows.length === 1 ? 'row' : 'rows'} to clipboard. Paste into Word.`);
  } catch (e) {
    setStatus('Copy failed: ' + e.message, true);
    console.error(e);
  }
});

$('downloadBtn').addEventListener('click', async () => {
  const rows = [];
  document.querySelectorAll('#rows .row-card').forEach(card => {
    const row = {};
    card.querySelectorAll('input[data-field]').forEach(inp => { row[inp.dataset.field] = inp.value; });
    rows.push(row);
  });
  const meta = {
    site: $('site').value || 'Site',
    date: $('date').value,
    surveyor: $('surveyor').value,
    survey_type: $('survey_type').value,
  };
  setStatus('Generating .docx...');
  try {
    const res = await fetch('/api/docx', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ rows, meta }),
    });
    if (!res.ok) throw new Error(`docx failed (${res.status})`);
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = (meta.site.replace(/\s+/g, '_') || 'bat_survey') + '_activity_log.docx';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    setStatus('.docx downloaded.');
  } catch (e) {
    setStatus('Error: ' + e.message, true);
  }
});
</script>
</body>
</html>
